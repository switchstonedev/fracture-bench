<rect x="666.0" y="277.6" width="8" height="8" fill="#D55E00" class="point" />

<!-- 3. LanceDB (Purple #CC79A7) -->
<polyline fill="none" stroke="#CC79A7" stroke-width="2.2" points="80.0,81.7 198.0,92.3 316.0,119.1 434.0,163.8 552.0,214.1 670.0,267.8" />
<polygon points="80.0,77.0 85.0,85.5 75.0,85.5" fill="#CC79A7" class="point" />
<polygon points="198.0,87.6 203.0,96.1 193.0,96.1" fill="#CC79A7" class="point" />
<polygon points="316.0,114.4 321.0,122.9 311.0,122.9" fill="#CC79A7" class="point" />
<polygon points="434.0,159.1 439.0,167.6 429.0,167.6" fill="#CC79A7" class="point" />
<polygon points="552.0,209.4 557.0,217.9 547.0,217.9" fill="#CC79A7" class="point" />
<polygon points="670.0,263.1 675.0,271.6 665.0,271.6" fill="#CC79A7" class="point" />

<!-- 4. pgvector (Green #009E73) -->
<polyline fill="none" stroke="#009E73" stroke-width="2.2" points="80.0,89.0 198.0,103.6 316.0,135.3 434.0,195.4 552.0,269.4 670.0,327.9" />
<polygon points="80.0,84.5 84.5,89.0 80.0,93.5 75.5,89.0" fill="#009E73" class="point" />
<polygon points="198.0,99.1 202.5,103.6 198.0,108.1 193.5,103.6" fill="#009E73" class="point" />
<polygon points="316.0,130.8 320.5,135.3 316.0,139.8 311.5,135.3" fill="#009E73" class="point" />
<polygon points="434.0,190.9 438.5,195.4 434.0,199.9 429.5,195.4" fill="#009E73" class="point" />
<polygon points="552.0,264.9 556.5,269.4 552.0,273.9 547.5,269.4" fill="#009E73" class="point" />
<polygon points="670.0,323.4 674.5,327.9 670.0,332.4 665.5,327.9" fill="#009E73" class="point" />

<!-- Axis Titles -->
<text x="375" y="426" text-anchor="middle" class="axis-title">Tombstone Saturation Ratio (τ = Dead / Active) & Accumulated Mutations</text>
<text transform="rotate(-90)" x="-212" y="25" text-anchor="middle" class="axis-title">Mean Recall@10 (SIMD Linear Ground Truth)</text>

<!-- Legend -->
<rect x="95" y="275" width="230" height="90" fill="#ffffff" fill-opacity="0.9" stroke="#e5e7eb" rx="4" />

<line x1="105" y1="290" x2="135" y2="290" stroke="#0072B2" stroke-width="2.2" />
<circle cx="120" cy="290" r="4" fill="#0072B2" stroke="#fff" stroke-width="1" />
<text x="145" y="294" class="legend">Qdrant (0.975 → 0.764)</text>

<line x1="105" y1="312" x2="135" y2="312" stroke="#D55E00" stroke-width="2.2" />
<rect x="116" y="308" width="8" height="8" fill="#D55E00" stroke="#fff" stroke-width="1" />
