<line x1="105" y1="356" x2="135" y2="356" stroke="#009E73" stroke-width="2.2" />
<polygon points="120,352 124,356 120,360 116,356" fill="#009E73" stroke="#fff" stroke-width="1" />
<text x="145" y="360" class="legend">pgvector (0.952 → 0.658)</text>
</svg>
