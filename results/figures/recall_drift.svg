<rect x="76.0" y="72.0" width="8" height="8" fill="#D55E00" class="point" />
<rect x="194.0" y="85.8" width="8" height="8" fill="#D55E00" class="point" />
<rect x="312.0" y="111.0" width="8" height="8" fill="#D55E00" class="point" />
