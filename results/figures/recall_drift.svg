<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 440" width="720" height="440">
<style>
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #111; }
  .axis-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: bold; fill: #333; }
  .axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #555; }
  .sub-axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9px; fill: #777; }
  .grid { stroke: #e5e7eb; stroke-width: 1; stroke-dasharray: 4,4; }
  .axis-line { stroke: #9ca3af; stroke-width: 1.2; }
  .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #333; }
  .point { stroke-width: 1.5; stroke: #fff; }
</style>
<rect width="720" height="440" fill="#ffffff" />
<text x="80" y="28" class="title">Graph Fragmentation: Point-in-Time Recall@10 vs. Tombstone Saturation (τ)</text>

<!-- Horizontal Grid & Y-Axis Labels (Recall@10: 0.60 to 1.00) -->
<line x1="80" y1="375.0" x2="670" y2="375.0" class="grid" />
<text x="70" y="379.0" text-anchor="end" class="axis">0.60</text>

<line x1="80" y1="293.75" x2="670" y2="293.75" class="grid" />
<text x="70" y="297.75" text-anchor="end" class="axis">0.70</text>

<line x1="80" y1="212.5" x2="670" y2="212.5" class="grid" />
<text x="70" y="216.5" text-anchor="end" class="axis">0.80</text>

<line x1="80" y1="131.25" x2="670" y2="131.25" class="grid" />
<text x="70" y="135.25" text-anchor="end" class="axis">0.90</text>

<line x1="80" y1="50.0" x2="670" y2="50.0" class="grid" />
<text x="70" y="54.0" text-anchor="end" class="axis">1.00</text>

<!-- Vertical Grid & X-Axis Labels (Tombstone Saturation tau) -->
<line x1="80.0" y1="50" x2="80.0" y2="375" class="grid" />
<text x="80.0" y="393" text-anchor="middle" class="axis">τ = 0.0</text>
<text x="80.0" y="407" text-anchor="middle" class="sub-axis">(0 dead)</text>

<line x1="198.0" y1="50" x2="198.0" y2="375" class="grid" />
<text x="198.0" y="393" text-anchor="middle" class="axis">τ = 0.1</text>
<text x="198.0" y="407" text-anchor="middle" class="sub-axis">(10k dead)</text>

<line x1="316.0" y1="50" x2="316.0" y2="375" class="grid" />
<text x="316.0" y="393" text-anchor="middle" class="axis">τ = 0.2</text>
<text x="316.0" y="407" text-anchor="middle" class="sub-axis">(20k dead)</text>

<line x1="434.0" y1="50" x2="434.0" y2="375" class="grid" />
<text x="434.0" y="393" text-anchor="middle" class="axis">τ = 0.3</text>
<text x="434.0" y="407" text-anchor="middle" class="sub-axis">(30k dead)</text>

<line x1="552.0" y1="50" x2="552.0" y2="375" class="grid" />
<text x="552.0" y="393" text-anchor="middle" class="axis">τ = 0.4</text>
<text x="552.0" y="407" text-anchor="middle" class="sub-axis">(40k dead)</text>

<line x1="670.0" y1="50" x2="670.0" y2="375" class="grid" />
<text x="670.0" y="393" text-anchor="middle" class="axis">τ = 0.5</text>
<text x="670.0" y="407" text-anchor="middle" class="sub-axis">(50k dead)</text>

<!-- Bounding Box Axes -->
<line x1="80" y1="375" x2="670" y2="375" class="axis-line" />
<line x1="80" y1="50" x2="80" y2="375" class="axis-line" />

<!-- 1. Qdrant (Blue #0072B2) -->
<polyline fill="none" stroke="#0072B2" stroke-width="2.2" points="80.0,70.3 198.0,80.9 316.0,100.4 434.0,144.3 552.0,202.8 670.0,241.8" />
<circle cx="80.0" cy="70.3" r="4.5" fill="#0072B2" class="point" />
<circle cx="198.0" cy="80.9" r="4.5" fill="#0072B2" class="point" />
<circle cx="316.0" cy="100.4" r="4.5" fill="#0072B2" class="point" />
<circle cx="434.0" cy="144.3" r="4.5" fill="#0072B2" class="point" />
<circle cx="552.0" cy="202.8" r="4.5" fill="#0072B2" class="point" />
<circle cx="670.0" cy="241.8" r="4.5" fill="#0072B2" class="point" />

