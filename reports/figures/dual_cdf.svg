<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
<style>
  .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14px; font-weight: bold; fill: #111; }
  .axis { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; fill: #555; }
  .grid { stroke: #e0e0e0; stroke-dasharray: 3,3; }
  .legend { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; }
</style>
<rect width="720" height="420" fill="#ffffff" />
<text x="75" y="25" class="title">Dual-CDF: Socket Service Time vs. Omission-Corrected Response Time</text>
<line x1="75" y1="360.0" x2="670" y2="360.0" class="grid" />
<text x="65" y="364.0" text-anchor="end" class="axis">50.0%</text>
<line x1="75" y1="107.99999999999999" x2="670" y2="107.99999999999999" class="grid" />
<text x="65" y="111.99999999999999" text-anchor="end" class="axis">90.0%</text>
<line x1="75" y1="51.300000000000004" x2="670" y2="51.300000000000004" class="grid" />
<text x="65" y="55.300000000000004" text-anchor="end" class="axis">99.00%</text>
<line x1="75" y1="45.63" x2="670" y2="45.63" class="grid" />
<text x="65" y="49.63" text-anchor="end" class="axis">99.90%</text>
<polyline fill="none" stroke="#1f77b4" stroke-width="2.5" points="494.3,360.0 616.6,108.0 669.4,51.3 669.4,45.6" />
<polyline fill="none" stroke="#d62728" stroke-width="2.5" stroke-dasharray="5,4" points="505.5,360.0 617.5,108.0 670.0,51.3 670.0,45.6" />
<text x="372.5" y="405" text-anchor="middle" class="axis">Latency (µs, Log Scale)</text>
<line x1="95" y1="65" x2="125" y2="65" stroke="#1f77b4" stroke-width="2.5" />
<text x="130" y="69" class="legend">Service Time (Socket RTT)</text>
<line x1="95" y1="85" x2="125" y2="85" stroke="#d62728" stroke-width="2.5" stroke-dasharray="5,4" />
<text x="130" y="89" class="legend">Total Response Time (Omission-Corrected)</text>
</svg>