[workspace]
resolver = "2"
members = [
    "crates/fracture-core",
    "crates/fracture-pacer",
    "crates/fracture-telemetry",
    "crates/fracture-adapters",
    "crates/fracture-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Mrigank Bhatnagar <mrigankbhatnagar06@gmail.com>", "SwitchStone"]
license = "Apache-2.0"
repository = "https://github.com/switchstonedev/fracture-bench"
readme = "README.md"

[workspace.dependencies]
# Internal crates
fracture-core = { path = "crates/fracture-core" }
fracture-pacer = { path = "crates/fracture-pacer" }
fracture-telemetry = { path = "crates/fracture-telemetry" }
fracture-adapters = { path = "crates/fracture-adapters" }

# High-precision timing & concurrency
quanta = "0.12"
crossbeam-channel = "0.5"
core_affinity = "0.8"

# Numerical, SIMD & Serialization
bytemuck = { version = "1.16", features = ["derive"] }
rand = "0.8"
rand_xoshiro = "0.6"
hdrhistogram = "7.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime & CLI
tokio = { version = "1.38", features = ["full"] }
async-trait = "0.1"
anyhow = "1.0"
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
rayon = "1.10"
libc = "0.2"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false

