name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  publish-release:
    name: Build & Publish Release Assets
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            binary_name: fracture
            asset_name: fracture-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: fracture.exe
            asset_name: fracture-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: fracture
            asset_name: fracture-macos-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install musl tools (Linux)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build static release binary
        run: cargo build --release -p fracture-bench --target ${{ matrix.target }}

      - name: Stage binary asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} dist/${{ matrix.asset_name }}
          cd dist
          shasum -a 256 ${{ matrix.asset_name }} > ${{ matrix.asset_name }}.sha256

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset_name }}
            dist/${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
