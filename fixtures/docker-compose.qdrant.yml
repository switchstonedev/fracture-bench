version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.12.1
    container_name: fracture_qdrant
    restart: unless-stopped
    ports:
      - "6333:6333" # HTTP REST API
      - "6334:6334" # gRPC API
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_TELEMETRY=false
    volumes:
      - qdrant_storage:/qdrant/storage
    deploy:
      resources:
        limits:
          cpus: '4.00'
          memory: 8192M
        reservations:
          cpus: '4.00'
          memory: 7168M

volumes:
  qdrant_storage:

