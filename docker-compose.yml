version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:v1.8.0
    container_name: fracture-demo-qdrant
    restart: "no"
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__ENABLE_TELEMETRY=false
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/readyz || exit 1"]
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 2s

  demo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fracture-demo-runner
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ./reports:/workspace/reports
      - ./results:/workspace/results
    environment:
      - FRACTURE_QDRANT_ENDPOINT=http://qdrant:6333
    command: ["--tier", "dry_run", "--skip-manifest-check"]
